
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roop Body Spa - Google Reviews</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#17121d,#3b2440,#17121d);
  color: white;
  padding: 25px 15px;
}
.container {
  max-width: 600px;
  margin: auto;
  text-align: center;
}
h1 {
  color: #f4d18b;
  font-size: 32px;
  margin-bottom: 8px;
}
.subtitle {
  color: #eee;
  margin-bottom: 25px;
}
.review {
  background: #fff;
  color: #29212b;
  padding: 20px;
  border-radius: 16px;
  margin: 18px 0;
  text-align: left;
  box-shadow: 0 5px 20px #0005;
}
.review h2 {
  color: #9b6b25;
  font-size: 19px;
}
textarea {
  width: 100%;
  min-height: 105px;
  border: 1px solid #ddd;
  border-radius: 9px;
  padding: 12px;
  font-size: 15px;
  line-height: 1.5;
  resize: vertical;
}
button {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 9px;
  margin-top: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.copy {
  background: #a77b36;
  color: white;
}
.google {
  background: #198754;
  color: white;
  margin-top: 22px;
}
.note {
  font-size: 13px;
  color: #ddd;
  line-height: 1.6;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

<h1>ROOP BODY SPA</h1>
<p class="subtitle">We Value Your Experience ❤️</p>

<h3>Choose Your Review</h3>

<div class="review">
<h2>⭐ Review 1 – Simple & Professional</h2>
<textarea id="r1">I had a good experience at Roop Body Spa. The staff was polite and welcoming. Thank you for the service!</textarea>
<button class="copy" onclick="copyReview('r1',this)">📋 Copy Review 1</button>
</div>

<div class="review">
<h2>⭐ Review 2 – Luxury Experience</h2>
<textarea id="r2">My experience at Roop Body Spa was pleasant. I enjoyed the atmosphere and appreciated the hospitality. Would recommend visiting!</textarea>
<button class="copy" onclick="copyReview('r2',this)">📋 Copy Review 2</button>
</div>

<div class="review">
<h2>⭐ Review 3 – Customer Service</h2>
<textarea id="r3">Thank you Roop Body Spa for the service. The team was friendly and made me feel welcome. I appreciate the experience!</textarea>
<button class="copy" onclick="copyReview('r3',this)">📋 Copy Review 3</button>
</div>

<p class="note">
Please edit the review to reflect your genuine experience.
Your honest feedback helps us improve.
</p>

<button class="google" onclick="window.open('https://g.page/r/CWkiEcK_xf32EBM/review','_blank')">
⭐ OPEN GOOGLE & POST YOUR REVIEW
</button>

</div>

<script>
async function copyReview(id,button) {
  const text = document.getElementById(id).value;
  try {
    await navigator.clipboard.writeText(text);
    button.innerText = "✓ Copied Successfully!";
  } catch (e) {
    const field = document.getElementById(id);
    field.select();
    document.execCommand("copy");
    button.innerText = "✓ Copied!";
  }
  setTimeout(() => {
    button.innerText = "📋 Copy Review " + id.slice(1);
  }, 2500);
}
</script>

</body>
</html>
